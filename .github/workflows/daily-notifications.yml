name: Daily Push Notifications

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest

    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Send notification to all users
        run: |
          curl --request POST \
            --url https://onesignal.com/api/v1/notifications \
            --header 'Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Total Subscriptions"],
              "headings": {"en": "Новая подборка!"},
              "contents": {"en": "Загляни, мы тут кое-что для тебя собрали 🔥"},
              "data": {
                "type": "daily_digest",
                "timestamp": "$(date +%Y-%m-%d_%H:%M:%S)"
              }
            }'

      - name: Log result
        run: echo "Уведомление отправлено $(date)"